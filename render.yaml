# Free submission deployment. Background email workers are not included.
services:
  - type: web
    name: book-my-show
    runtime: python
    plan: free
    region: singapore
    buildCommand: bash build.sh
    startCommand: bash start.sh
    healthCheckPath: /health/
    autoDeployTrigger: 'off'
    envVars:
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: book-my-show-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_SUPERUSER_USERNAME
        value: submission_admin
      - key: DJANGO_SUPERUSER_PASSWORD
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
databases:
  - name: book-my-show-db
    databaseName: bookmyshow
    plan: free
    region: singapore
    ipAllowList: []
