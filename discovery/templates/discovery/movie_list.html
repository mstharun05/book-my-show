{% extends 'discovery/base.html' %}
{% load static %}
{% block title %}Discover movies | Book My Show{% endblock %}
{% block content %}
<section class="movie-section">
<h1>Discover movies</h1>
<form method="get" id="discovery-filters" class="filter-panel" style="flex-wrap:wrap;align-items:end">
{% for field in form %}
<label style="display:flex;flex-direction:column;gap:6px;min-width:160px">{{ field.label }}{{ field }}</label>
{% endfor %}
<button type="submit">Apply filters</button><a href="{% url 'discovery:movie_list' %}">Clear filters</a>
</form>
<p id="filter-status" role="status" aria-live="polite"></p>
<div id="discovery-results">{% include "discovery/results.html" %}</div>
</section>
<script src="{% static 'discovery/filters.js' %}"></script>
{% endblock %}
